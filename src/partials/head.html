    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0F1722" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F4ECDC" media="(prefers-color-scheme: light)" />
    <script>
      /* Before first paint: theme (?theme= for previews, saved choice, else the system setting, dark by default)
         and the document language (?lang=, saved choice, else the browser: pl -> Polish, tr -> Turkish, else English). */
      (function () {
        var d = document.documentElement, t = null, l = null, q = null;
        try { q = new URLSearchParams(location.search); } catch (e) {}
        try { t = (q && q.get("theme")) || localStorage.getItem("pf_theme"); } catch (e) {}
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        d.setAttribute("data-theme", t);
        try { l = (q && q.get("lang")) || localStorage.getItem("pf_lang"); } catch (e) {}
        if (l === "pl" || l === "tr" || l === "en") d.lang = l;
      })();
    </script>
